<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Mellali Scent</title><style>
:root{--black:#080808;--gold:#c9a96a;--cream:#f6f3ed;--line:#ddd7cc;--danger:#a51d2d;--green:#1f7a4d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#151515;font-family:Arial,Helvetica,sans-serif}header{background:#080808;color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}header h1{font:normal 25px Georgia,serif;margin:0;color:var(--gold)}header a{color:#fff;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{border:1px solid #bbb;background:#fff;padding:10px 14px;border-radius:8px;white-space:nowrap;cursor:pointer}.tabs button.active{background:#080808;color:#fff}.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}.panel.active{display:block}.panel h2{font:normal 25px Georgia,serif;margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccc;border-radius:7px;background:#fff;font:inherit}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:7px;padding:11px 15px;background:#080808;color:#fff;cursor:pointer}.btn.gold{background:#c9a96a;color:#111}.btn.red{background:var(--danger)}.btn.green{background:var(--green)}.product-row{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0}.thumb{width:72px;height:72px;border-radius:7px;background:radial-gradient(circle,#6b5a45,#211b15 45%,#0b0b0b);background-size:cover;background-position:center}.product-row h3{font-size:15px;margin:0 0 5px}.product-row p{margin:0;color:#777;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.note{background:#fff8e8;border:1px solid #ead6a2;padding:12px;border-radius:8px;font-size:12px;line-height:1.6;margin-bottom:14px}.empty{padding:20px;text-align:center;color:#777}.toast{position:fixed;right:15px;bottom:15px;background:#080808;color:#fff;padding:12px 15px;border-radius:8px;display:none;z-index:99}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.modal-box{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;font-size:25px;cursor:pointer}.danger-note{font-size:11px;color:#8b1e2d}.check{display:flex;gap:8px;align-items:center;font-size:13px}@media(max-width:700px){.grid2{grid-template-columns:1fr}.product-row{grid-template-columns:56px 1fr}.product-row .actions{grid-column:1/-1}.thumb{width:56px;height:56px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><h1>MELLALI SCENT — ADMIN</h1><a href="index.html">← المتجر</a></header><div class="wrap">
<div class="note">لوحة التحكم مربوطة الآن بـ Supabase. التعديلات والمنتوجات كتتحفظ في قاعدة البيانات وكتبان لجميع الأجهزة.</div>
<div class="tabs"><button class="active" data-tab="products">المنتوجات</button><button data-tab="pages">الصفحات</button><button data-tab="contact">المعلومات والواتساب</button></div>
<section id="products" class="panel active"><h2>إدارة المنتوجات</h2><button class="btn gold" onclick="openProduct()">＋ إضافة منتوج</button><div id="productList"></div></section>
<section id="pages" class="panel"><h2>تعديل الصفحات</h2><div class="grid2">
<div class="field"><label>عنوان الصفحة الرئيسية</label><input id="homeTitle"></div><div class="field"><label>النص الصغير فوق العنوان</label><input id="homeEyebrow"></div>
<div class="field" style="grid-column:1/-1"><label>وصف الصفحة الرئيسية</label><textarea id="homeText"></textarea></div>
<div class="field"><label>عنوان Parfums Complets</label><input id="fullTitle"></div><div class="field"><label>وصف Parfums Complets</label><input id="fullDesc"></div>
<div class="field"><label>عنوان Échantillons</label><input id="sampleTitle"></div><div class="field"><label>وصف Échantillons</label><input id="sampleDesc"></div>
<div class="field"><label>عنوان Miniatures</label><input id="miniTitle"></div><div class="field"><label>وصف Miniatures</label><input id="miniDesc"></div>
<div class="field"><label>نص قسم About</label><input id="aboutText"></div>
</div><button class="btn green" onclick="savePages()">حفظ تعديلات الصفحات</button></section>
<section id="contact" class="panel"><h2>المعلومات و WhatsApp</h2><div class="grid2"><div class="field"><label>رقم WhatsApp (مثال: 0697413699)</label><input id="wa"></div><div class="field"><label>Instagram</label><input id="instagram"></div><div class="field"><label>TikTok</label><input id="tiktok"></div><div class="field"><label>نص À PROPOS</label><input id="footerAbout"></div></div><button class="btn green" onclick="saveContact()">حفظ المعلومات</button></section>
</div><div class="toast" id="toast"></div>
<div class="modal" id="productModal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">إضافة منتوج</h2><button class="close" onclick="closeProduct()">×</button></div><div class="grid2"><div class="field"><label>اسم المنتوج</label><input id="pName"></div><div class="field"><label>الثمن</label><input id="pPrice" placeholder="مثال: 250 DH"></div><div class="field"><label>القسم</label><select id="pCategory"><option value="full">Parfums Complets</option><option value="samples">Échantillons</option><option value="mini">Miniatures</option></select></div><div class="field"><label>رابط الصورة (اختياري)</label><input id="pImage" placeholder="https://..."></div><div class="field" style="grid-column:1/-1"><label>أو اختر صورة من الهاتف</label><input id="pFile" type="file" accept="image/*"></div></div><p class="danger-note">الصورة المختارة من الهاتف تتحفظ داخل المتصفح. الصور الكبيرة بزاف يمكن تزيد حجم التخزين.</p><input type="hidden" id="pId"><div class="actions"><button class="btn green" onclick="saveProduct()">حفظ المنتوج</button><button class="btn" onclick="closeProduct()">إلغاء</button></div></div></div>
<script>
const db=supabase.createClient('https://irdkrwfopmzplbkosfle.supabase.co','sb_publishable_ht0kkZsnW3SMVt08TLaTaw_wXyNTJlv'); const ADMIN_PASSWORD='MELLALI-7419';
let products=[];
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadAll(){const [pr,pa,co]=await Promise.all([db.from('products').select('*').order('created_at',{ascending:true}),db.from('pages').select('data').eq('id',1).maybeSingle(),db.from('contact').select('data').eq('id',1).maybeSingle()]);if(pr.error){toast('خطأ في Supabase: '+pr.error.message);return}products=pr.data||[];render();const p=pa.data?.data||{},c=co.data?.data||{};homeTitle.value=p.homeTitle||'MELLALI SCENT';homeEyebrow.value=p.homeEyebrow||'BIENVENUE CHEZ';homeText.value=p.homeText||'';fullTitle.value=p.fullTitle||'Parfums Complets';fullDesc.value=p.fullDesc||'Découvrez les parfums en format complet.';sampleTitle.value=p.sampleTitle||'Échantillons';sampleDesc.value=p.sampleDesc||'Testez vos fragrances avant de choisir votre format.';miniTitle.value=p.miniTitle||'Miniatures';miniDesc.value=p.miniDesc||'Des formats mini pour collectionner et découvrir.';aboutText.value=p.aboutText||'Une sélection pensée pour les passionnés de parfums.';wa.value=c.wa||'0697413699';instagram.value=c.instagram||'mellali_scent_';tiktok.value=c.tiktok||'mellali_scent_';footerAbout.value=c.about||'Une sélection pensée pour les passionnés de parfums.'}
function render(){const el=document.getElementById('productList');if(!products.length){el.innerHTML='<div class="empty">لا توجد منتوجات.</div>';return}el.innerHTML=products.map(x=>`<div class="product-row"><div class="thumb" style="${x.image?`background-image:url('${String(x.image).replace(/'/g,'%27')}')`:''}"></div><div><h3>${esc(x.name)}</h3><p>${esc(x.category)} · ${esc(x.price||'Prix à ajouter')}</p></div><div class="actions"><button class="btn" onclick="openProduct('${x.id}')">تعديل</button><button class="btn red" onclick="removeProduct('${x.id}')">حذف</button></div></div>`).join('')}
function openProduct(id){let p=products.find(x=>x.id===id);pId.value=p?.id||'';pName.value=p?.name||'';pPrice.value=p?.price||'';pCategory.value=p?.category||'full';pImage.value=p?.image?.startsWith('data:')?'':(p?.image||'');pFile.value='';modalTitle.textContent=p?'تعديل المنتوج':'إضافة منتوج';productModal.classList.add('open')}
function closeProduct(){productModal.classList.remove('open')}
async function saveProduct(){let id=pId.value||('p-'+Date.now()),name=pName.value.trim();if(!name){alert('دخل اسم المنتوج');return}let image=pImage.value.trim(),file=pFile.files[0];if(file){let r=new FileReader();r.onload=()=>saveProductData(id,name,pPrice.value.trim()||'Prix à ajouter',pCategory.value,r.result);r.readAsDataURL(file);return}await saveProductData(id,name,pPrice.value.trim()||'Prix à ajouter',pCategory.value,image)}
async function saveProductData(id,name,price,category,image){const {error}=await db.rpc('admin_save_product',{p_password:ADMIN_PASSWORD,p_id:id,p_name:name,p_price:price,p_category:category,p_image:image});if(error){alert(error.message);return}toast('تم حفظ المنتوج في Supabase ✓');closeProduct();await loadAll()}
async function removeProduct(id){if(!confirm('واش متأكد بغيتي تحيد هاد المنتوج؟'))return;const {error}=await db.rpc('admin_delete_product',{p_password:ADMIN_PASSWORD,p_id:id});if(error){alert(error.message);return}toast('تم حذف المنتوج ✓');await loadAll()}
async function savePages(){let p={homeTitle:homeTitle.value.trim(),homeEyebrow:homeEyebrow.value.trim(),homeText:homeText.value.trim(),fullTitle:fullTitle.value.trim(),fullDesc:fullDesc.value.trim(),sampleTitle:sampleTitle.value.trim(),sampleDesc:sampleDesc.value.trim(),miniTitle:miniTitle.value.trim(),miniDesc:miniDesc.value.trim(),aboutText:aboutText.value.trim()};const {error}=await db.rpc('admin_save_pages',{p_password:ADMIN_PASSWORD,p_data:p});if(error){alert(error.message);return}toast('تم حفظ تعديلات الصفحات ✓')}
async function saveContact(){let c={wa:wa.value.trim(),instagram:instagram.value.trim(),tiktok:tiktok.value.trim(),about:footerAbout.value.trim()};const {error}=await db.rpc('admin_save_contact',{p_password:ADMIN_PASSWORD,p_data:c});if(error){alert(error.message);return}toast('تم حفظ المعلومات ✓')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
loadAll();
</script></body></html>
